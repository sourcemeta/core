name: Core

on:
  schedule:
    # Once per day, Monday to Friday
    - cron: '0 19 * * 1-5'
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            cc: clang
            cxx: clang++
            type: static
            shell: sh
            benchmark: macos/llvm
          - os: macos-latest
            cc: clang
            cxx: clang++
            type: shared
            shell: sh
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
            type: static
            shell: sh
            benchmark: linux/llvm
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
            type: static
            shell: sh
            options: -DSOURCEMETA_CORE_CRYPTO_USE_SYSTEM_OPENSSL:BOOL=ON -DSOURCEMETA_CORE_HTTP_USE_SYSTEM_CURL:BOOL=ON
            apt: libcurl4-openssl-dev
            benchmark: linux/gcc
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
            type: shared
            shell: sh
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
            type: shared
            shell: sh
          - os: windows-latest
            type: static
            shell: pwsh
            benchmark: windows/msvc
          - os: windows-latest
            type: shared
            shell: pwsh
          - os: windows-latest
            cc: gcc
            cxx: g++
            type: static
            shell: 'msys2 {0}'
            msystem: MINGW64

          # Sanitizers
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
            type: static
            shell: sh
            options: -DSOURCEMETA_CORE_ADDRESS_SANITIZER:BOOL=ON

    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    runs-on: ${{ matrix.platform.os }}
    env:
      CC: ${{ matrix.platform.cc }}
      CXX: ${{ matrix.platform.cxx }}

      # The build downloads a pinned compiler cache of its own during
      # configuration and points the compiler at it, so the only settings left
      # here are the ones that route cannot carry. The Visual Studio generator
      # ignores compiler launchers, so those builds read the cache location
      # from the environment rather than from the build system
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BINARY: ./build/bin/ccache${{ startsWith(matrix.platform.os, 'windows') && '.exe' || '' }}
      # Runner images are re-provisioned on every run, so the default check of
      # the compiler modification time and size would miss on an unchanged
      # compiler. Hash its contents instead
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
      # Bump the version segment to invalidate every compiler cache by hand.
      # The job index disambiguates matrix entries that otherwise share an
      # operating system, a compiler, and a linkage
      CACHE_KEY: ccache-v2-${{ matrix.platform.os }}-${{ matrix.platform.cc || 'msvc' }}-${{ matrix.platform.type }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup MSYS2 (Windows)
        if: matrix.platform.msystem
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.platform.msystem }}
          update: true
          pacboy: gcc:p cmake:p
      - name: Install dependencies (macOS)
        if: runner.os == 'macos'
        run: brew bundle
        env:
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
      # Only the job that builds against the system libraries still reaches for
      # the package manager. The Azure Ubuntu mirror stalls often enough to
      # matter, and without a bound a stalled mirror burns the entire job
      # timeout rather than failing while the run is still useful
      - name: Install dependencies (Linux)
        if: matrix.platform.apt
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install --yes ${{ matrix.platform.apt }}
      # The primary key never matches, as it carries the run identifier, so a
      # restore always walks the fallbacks in order. A previous run of this same
      # pull request comes first, as it is the closest to what we are about to
      # compile, and `main` is the fallback. A cache written by a pull request
      # run is only visible to re-runs of that same pull request, so no entry
      # here can leak sideways into an unrelated branch
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ env.CACHE_KEY }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-${{ github.ref_name }}-
            ${{ env.CACHE_KEY }}-main-

      - run: cmake --version
      - name: Configure (static)
        if: matrix.platform.type == 'static'
        run: >
          cmake -S . -B ./build
          -DCMAKE_BUILD_TYPE:STRING=Release
          -DSOURCEMETA_CORE_TESTS:BOOL=ON
          -DSOURCEMETA_CORE_TESTS_CI:BOOL=ON
          -DSOURCEMETA_CORE_BENCHMARK:BOOL=ON
          -DSOURCEMETA_CORE_DOCS:BOOL=OFF
          -DBUILD_SHARED_LIBS:BOOL=OFF
          -DCMAKE_COMPILE_WARNING_AS_ERROR:BOOL=ON
          ${{ matrix.platform.options }}
      - name: Configure (shared)
        if: matrix.platform.type == 'shared'
        run: >
          cmake -S . -B ./build
          -DCMAKE_BUILD_TYPE:STRING=Release
          -DSOURCEMETA_CORE_TESTS:BOOL=ON
          -DSOURCEMETA_CORE_TESTS_CI:BOOL=ON
          -DSOURCEMETA_CORE_BENCHMARK:BOOL=ON
          -DSOURCEMETA_CORE_DOCS:BOOL=OFF
          -DBUILD_SHARED_LIBS:BOOL=ON
          -DCMAKE_COMPILE_WARNING_AS_ERROR:BOOL=ON
          ${{ matrix.platform.options }}
      - run: ${{ env.CCACHE_BINARY }} --zero-stats
      - run: cmake --build ./build --config Release --target clang_format_test
      - run: cmake --build ./build --config Release --parallel 4
      - run: ${{ env.CCACHE_BINARY }} --show-stats
      - run: >
          cmake --install ./build --prefix ./build/dist --config Release --verbose
          --component sourcemeta_core
      - run: >
          cmake --install ./build --prefix ./build/dist --config Release --verbose
          --component sourcemeta_core_dev

      # Not every CTest version supports the --test-dir option. If such option
      # is not recognized, `ctest` will successfully exit finding no tests.
      # Better to be sure and `cd` all the time here.
      - run: cd ./build && ctest --build-config Release --output-on-failure --parallel
        env:
          # See https://clang.llvm.org/docs/UndefinedBehaviorSanitizer.html
          UBSAN_OPTIONS: print_stacktrace=1

      - run: cmake --build ./build --config Release --verbose --target benchmark_all
        if: matrix.platform.benchmark
      - run: cmake --build ./build --config Release --verbose --target benchmark_json
        if: matrix.platform.benchmark

      - uses: benchmark-action/github-action-benchmark@v1
        # Avoid posting messages on forks until we figure out how to make it work
        # See https://github.com/benchmark-action/github-action-benchmark/issues/279
        if: matrix.platform.benchmark && github.event.pull_request.head.repo.fork == false
        with:
          name: Benchmark (${{ matrix.platform.benchmark }})
          tool: googlecpp
          output-file-path: build/benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: benchmark/${{ matrix.platform.benchmark }}
          alert-threshold: '5%'
          comment-always: true
          fail-on-alert: false

      # Saving on a cancelled run is pointless, as the cache would only hold
      # whatever the build got through before the interruption
      - name: Save ccache
        if: success() || failure()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
