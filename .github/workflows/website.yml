name: website
on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# What a pull request is allowed to do, which is nothing beyond reading the
# repository. The job that publishes asks for more on its own
permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Fedora provides a modern Doxygen out of the box
    container: fedora:latest
    env:
      # Compiler caching, matching the setup of the main CI workflow
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # A fixed path inside the container, as the temporary directory of the
      # runner answers to one name on the host and another one in here, and no
      # single spelling of it is correct on both sides
      CCACHE_DIR: /tmp/ccache
      # Runner images are re-provisioned on every run, so the default check of
      # the compiler modification time and size would miss on an unchanged
      # compiler. Hash its contents instead
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
      # Bump the version segment to invalidate the compiler cache by hand
      CACHE_KEY: ccache-v1-website-coverage
    steps:
      - name: Install dependencies
        run: dnf install --assumeyes doxygen cmake gcc-c++ graphviz git clang llvm ccache libstdc++-static diffutils util-linux
      - uses: actions/checkout@v7
      # The primary key never matches, as it carries the run identifier, so a
      # restore always walks the fallbacks in order. A previous run of this same
      # pull request comes first, as it is the closest to what we are about to
      # compile, and `main` is the fallback. A cache written by a pull request
      # run is only visible to re-runs of that same pull request, so the entry
      # every branch shares is the one a push to `main` leaves behind
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/ccache
          key: ${{ env.CACHE_KEY }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-${{ github.ref_name }}-
            ${{ env.CACHE_KEY }}-main-
      - run: ccache --zero-stats
      # Container jobs run as root, and a superuser is not constrained by the
      # permission bits that part of the suite asserts on
      - name: Build the website
        run: |
          useradd --create-home builder
          mkdir -p /tmp/ccache
          chown -R builder . /tmp/ccache
          runuser -u builder -- ./contrib/website.sh ./build
      - run: ccache --show-stats
      # Saving on a cancelled run is pointless, as the cache would only hold
      # whatever the build got through before the interruption
      - name: Save ccache
        if: success() || failure()
        uses: actions/cache/save@v6
        with:
          path: /tmp/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      # A pull request builds the site to prove that it still builds, and stops
      # there, so nothing is uploaded for it
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/website

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    # Replaces rather than extends the read-only default above, and only for
    # this job, so that a pull request never runs with the ability to publish
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
